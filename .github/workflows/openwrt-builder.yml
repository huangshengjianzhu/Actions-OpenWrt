name: OpenWrt Builder
on:
  repository_dispatch:
  workflow_dispatch:
env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config && sed -i '/^CONFIG_ALL_KMODS=y$/s/^/# /' openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: Cache build progress
      uses: actions/cache@v4
      with:
        path: |
          /workdir/openwrt/build_dir
          /workdir/openwrt/staging_dir
          /workdir/openwrt/feeds
          /workdir/.ccache
        key: openwrt-progress-${{ github.run_id }}
        restore-keys: |
          openwrt-progress-
    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      run: |
        export USE_CCACHE=1
        export CCACHE_DIR=/workdir/.ccache
        cd openwrt
        sed -i 's/^CONFIG_ALL_KMODS=y/# CONFIG_ALL_KMODS is not set/' .config
        sed -i '/^CONFIG_PACKAGE_kmod-fs-ntfs=/d' .config
        sed -i '/^CONFIG_PACKAGE_node=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-gpio-nct5104d=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-drm-radeon=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-drm-amdgpu=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-drm-nouveau=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-drm-i915=/d' .config
        sed -i '/^CONFIG_PACKAGE_kmod-jool-netfilter=/d' .config
        sed -i '/^CONFIG_PACKAGE_luci-app-fchomo=/d' .config
        for p in e1000e igb igc ixgbe i40e ice r8169 mlx5-core vmxnet3; do echo "CONFIG_PACKAGE_kmod-$p=y" >> .config; done
        make defconfig
        echo -e "$(nproc) thread compile, 最多5小时自动暂停保存进度,下次续编"
        timeout -k 5m 300m make -j$(nproc) 2>&1 | tee /tmp/make.log || true
        if ls bin/targets/*/*/openwrt-*-combined-efi.img.gz >/dev/null 2>&1; then
          echo "编译完成!"
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "编译未完成,等待下次续编"
          echo "status=partial" >> $GITHUB_OUTPUT
          echo "## ⚠️ 编译失败/未完成 — 日志尾部300行" >> $GITHUB_STEP_SUMMARY
          tail -300 /tmp/make.log >> $GITHUB_STEP_SUMMARY
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: Check space usage
      if: (!cancelled())
      run: df -hT
    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        if ls openwrt/bin/targets/*/*/openwrt-*-combined-efi.img.gz >/dev/null 2>&1; then
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "固件未生成(未完成或失败),编译进度已由Cache保存"
          echo "status=partial" >> $GITHUB_OUTPUT
        fi
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2
