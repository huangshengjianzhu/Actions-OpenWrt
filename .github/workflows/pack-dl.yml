name: Pack-DL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses-dev libz-dev patch python3 python3-pip unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex gcc-multilib g++-multilib p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx-ucl libelf-dev autoconf automake libtool autopoint gperf wget curl swig rsync

      - name: Clone lede
        run: git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt

      - name: Load custom feeds
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          $GITHUB_WORKSPACE/diy-part1.sh

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.config .config
          make defconfig

      - name: Download packages (DL)
        run: cd openwrt && (make download -j$(nproc) || true)

      - name: Pack all sources
        run: |
          cd openwrt
          tar czf ../openwrt-sources.tar.gz dl feeds package
          ls -lh ../openwrt-sources.tar.gz

      - name: Split and upload to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd /home/runner/work/Actions-OpenWrt/Actions-OpenWrt
          mkdir -p parts
          split -b 95M -d -a 2 openwrt-sources.tar.gz parts/part_
          echo "=== 分卷列表 ==="
          ls -lh parts/
          cat > upload.py << 'PYEOF'
          import os, json, time, urllib.request, uuid
          TOKEN = os.environ["GITEE_TOKEN"]
          TAG = "sources-" + str(int(time.time()))
          A = "https://gitee.com/api/v5/repos/yuanjianzhu/openwrt-sources"
          B = "https://gitee.com/api/v5/repos/yuanjianzhu/openwrt-sources-b"
          def api(url, data=None):
              req = urllib.request.Request(url, data=(json.dumps(data).encode() if data else None), headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except Exception as e:
                  return 0, str(e)
          def mkrel(base):
              for i in range(3):
                  st, d = api(base + "/releases?access_token=" + TOKEN, {"tag_name":TAG, "name":"openwrt-sources 分卷", "body":"auto", "target_commitish":"master", "prerelease":True})
                  if st == 201 and isinstance(d, dict) and d.get("id"):
                      return d["id"]
                  time.sleep(3)
              return None
          ra = mkrel(A); rb = mkrel(B)
          print("release A:", ra, "B:", rb)
          def attach(base, rel, path):
              if not rel: return False
              with open(path, "rb") as f: data = f.read()
              bd = "----dbb" + uuid.uuid4().hex
              head = ("--" + bd + "\r\nContent-Disposition: form-data; name=\"file\"; filename=\"" + os.path.basename(path) + "\"\r\nContent-Type: application/octet-stream\r\n\r\n").encode()
              tail = ("\r\n--" + bd + "--\r\n").encode()
              req = urllib.request.Request(base + "/releases/" + str(rel) + "/attach_files?access_token=" + TOKEN, data=head + data + tail, headers={"Content-Type":"multipart/form-data; boundary=" + bd})
              try:
                  with urllib.request.urlopen(req, timeout=600) as r:
                      return r.status in (200, 201)
              except Exception as e:
                  print("attach fail", os.path.basename(path), e)
                  return False
          ok = fail = 0
          files = sorted(os.listdir("parts"))
          for i, fn in enumerate(files):
              base, rel = (A, ra) if i % 2 == 0 else (B, rb)
              if attach(base, rel, os.path.join("parts", fn)):
                  ok += 1; print("OK", fn)
              else:
                  fail += 1; print("FAIL", fn)
          print("done ok=%d fail=%d" % (ok, fail))
          
          PYEOF
          python3 upload.py || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sources
          path: openwrt-sources.tar.gz
          retention-days: 7
