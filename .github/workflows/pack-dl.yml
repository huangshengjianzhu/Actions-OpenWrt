name: Pack-DL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses-dev libz-dev patch python3 python3-pip unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex gcc-multilib g++-multilib p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx-ucl libelf-dev autoconf automake libtool autopoint gperf wget curl swig rsync

      - name: Clone lede
        run: git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt

      - name: Load custom feeds
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          $GITHUB_WORKSPACE/diy-part1.sh

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.config .config
          make defconfig

      - name: Download packages (DL)
        run: cd openwrt && (make download -j$(nproc) || true)

      - name: Pack all sources
        run: |
          cd openwrt
          tar czf ../openwrt-sources.tar.gz dl feeds package
          ls -lh ../openwrt-sources.tar.gz

      - name: Split and upload to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd /home/runner/work/Actions-OpenWrt/Actions-OpenWrt
          mkdir -p parts
          split -b 95M -d -a 2 openwrt-sources.tar.gz parts/part_
          echo "=== 分卷列表 ==="
          ls -lh parts/
          TAG="sources-$(date +%s)"
          REL_A_ID=""
          for r in 1 2 3; do
            REL_A=$(curl -s -X POST "https://gitee.com/api/v5/repos/yuanjianzhu/openwrt-sources/releases?access_token=$GITEE_TOKEN" -H "Content-Type: application/json" -d "{\"tag_name\":\"$TAG\",\"name\":\"openwrt-sources 分卷A\",\"prerelease\":true}")
            REL_A_ID=$(echo "$REL_A" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
            [ -n "$REL_A_ID" ] && break
            echo "A release重试$r: $(echo $REL_A | head -c 120)"
            sleep 3
          done
          REL_B_ID=""
          for r in 1 2 3; do
            REL_B=$(curl -s -X POST "https://gitee.com/api/v5/repos/yuanjianzhu/openwrt-sources-b/releases?access_token=$GITEE_TOKEN" -H "Content-Type: application/json" -d "{\"tag_name\":\"$TAG\",\"name\":\"openwrt-sources 分卷B\",\"prerelease\":true}")
            REL_B_ID=$(echo "$REL_B" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
            [ -n "$REL_B_ID" ] && break
            echo "B release重试$r: $(echo $REL_B | head -c 120)"
            sleep 3
          done
          if [ -z "$REL_A_ID" ]; then echo "!!! 仓库A release创建失败"; fi
          if [ -z "$REL_B_ID" ]; then echo "!!! 仓库B release创建失败"; fi
          i=0; fail=0
          for f in parts/part_*; do
            if [ -n "$REL_A_ID" ] && [ $i -lt 10 ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://gitee.com/api/v5/repos/yuanjianzhu/openwrt-sources/releases/$REL_A_ID/attach_files?access_token=$GITEE_TOKEN" -F "file=@$f" || true)
            elif [ -n "$REL_B_ID" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://gitee.com/api/v5/repos/yuanjianzhu/openwrt-sources-b/releases/$REL_B_ID/attach_files?access_token=$GITEE_TOKEN" -F "file=@$f" || true)
            else
              code="000"
            fi
            echo "$f -> $code"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then fail=$((fail+1)); fi
            i=$((i+1))
          done
          echo "=== 上传完成, 失败 $fail 个 ==="
          if [ $fail -gt 0 ]; then echo "!!! 有 $fail 个分卷上传失败(原料包artifact已保底)"; fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sources
          path: openwrt-sources.tar.gz
          retention-days: 7
